[workspace]
members = [
    "crates/merra-cli",
    "crates/merra-core",
    "crates/merra-sim",
    "crates/merra-testkit",
    "crates/merra-tui",
    "crates/merra-worldgen",
    "xtask",
]
default-members = ["crates/merra-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/waynethewizard/Merra"
publish = false

[workspace.dependencies]
bevy_app = "0.19.0"
bevy_ecs = "0.19.0"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
merra-core = { version = "0.1.0", path = "crates/merra-core" }
merra-sim = { version = "0.1.0", path = "crates/merra-sim" }
merra-worldgen = { version = "0.1.0", path = "crates/merra-worldgen" }
rand = "0.10.2"
rand_chacha = "0.10.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "macros", "underline-color"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
